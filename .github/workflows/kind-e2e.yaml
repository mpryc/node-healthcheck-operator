name: Kind E2E Tests

on:
  push:
    branches: [main*, release-*]
  pull_request:
    branches: [main*, release-*]
  workflow_dispatch: {}

jobs:
  e2e-kind:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Shared dev environment
      TOOLS_DIR: ${{ github.workspace }}/.tools
      MEDIK8S_CLUSTER_NAME: medik8s-ci
      CONTAINER_TOOL: docker

      # Registry (created by dev-setup)
      MEDIK8S_REGISTRY_NAME: kind-registry
      MEDIK8S_REGISTRY_PORT: "5000"
      IMAGE_REGISTRY: kind-registry:5000
      OPM_RENDER_FLAGS: --skip-tls-verify

      # Deployment
      DEPLOY_SNR_NAMESPACE: snr-system
      DEPLOY_NHC_NAMESPACE: k8s-test

    steps:
    - name: Checkout NHC
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Clone medik8s/tools
      run: |
        git clone --depth 1 --branch testing-hang-clean https://github.com/mpryc/medik8s-tools.git $TOOLS_DIR
        touch $TOOLS_DIR/.managed-by-makefile

    - name: Install operator-sdk
      run: |
        make operator-sdk
        cp ./bin/operator-sdk /usr/local/bin/

    - name: Create Kind cluster with registry, OLM, and cert-manager
      run: make dev-setup

    - name: Deploy SNR via OLM bundle
      run: |
        kubectl create ns ${DEPLOY_SNR_NAMESPACE}
        kubectl label --overwrite ns ${DEPLOY_SNR_NAMESPACE} \
          pod-security.kubernetes.io/enforce=privileged \
          pod-security.kubernetes.io/audit=privileged \
          pod-security.kubernetes.io/warn=privileged
        operator-sdk run bundle -n ${DEPLOY_SNR_NAMESPACE} \
          --timeout 5m \
          quay.io/migi/self-node-remediation-operator-bundle

    - name: Override SNR reboot command for Kind
      run: |
        # On Kind, nodes are containers and can't truly reboot. Override the
        # reboot command to restart kubelet instead, which simulates recovery.
        kubectl -n ${DEPLOY_SNR_NAMESPACE} set env daemonset/self-node-remediation-ds \
          REBOOT_COMMAND_OVERRIDE="/bin/systemctl start kubelet"
        kubectl -n ${DEPLOY_SNR_NAMESPACE} rollout status daemonset/self-node-remediation-ds --timeout=120s

    - name: Build and push NHC
      run: |
        export NHC_SKIP_TEST=true
        make container-build-k8s

        NHC_IMG=${IMAGE_REGISTRY}/node-healthcheck-operator:latest
        NHC_BUNDLE=${IMAGE_REGISTRY}/node-healthcheck-operator-bundle:latest

        # NHC Makefile hardcodes podman for builds, so push with podman too
        podman push --tls-verify=false ${NHC_IMG}
        podman push --tls-verify=false ${NHC_BUNDLE}

    - name: Deploy NHC via OLM bundle
      run: |
        kubectl create ns ${DEPLOY_NHC_NAMESPACE}
        kubectl label --overwrite ns ${DEPLOY_NHC_NAMESPACE} \
          pod-security.kubernetes.io/enforce=privileged \
          pod-security.kubernetes.io/audit=privileged \
          pod-security.kubernetes.io/warn=privileged

        operator-sdk run bundle -n ${DEPLOY_NHC_NAMESPACE} --use-http \
          --timeout 5m \
          ${IMAGE_REGISTRY}/node-healthcheck-operator-bundle:latest

        # NHC's aggregated ClusterRole picks up SNR permissions via label selector,
        # but add an explicit binding as a safety net in case aggregation is slow.
        kubectl create clusterrolebinding nhc-snr-admin-binding \
          --clusterrole=self-node-remediation-ext-remediation \
          --serviceaccount=${DEPLOY_NHC_NAMESPACE}:node-healthcheck-operator-controller-manager \
          2>/dev/null || true

    - name: Wait for operators to be ready
      run: |
        make dev-wait

        # Controllers need time after pods are Ready to complete leader election
        # and initial reconciliation. Wait and verify NHC is active.
        echo "Waiting 30s for leader election and controller initialization..."
        sleep 30

        if kubectl get clusterrole node-healthcheck-operator-aggregation &>/dev/null; then
          echo "NHC aggregation ClusterRole found — controller is active."
        else
          echo "WARNING: aggregation ClusterRole not found, controller may not be ready yet. Waiting 30s more..."
          sleep 30
        fi

    - name: Run e2e tests
      run: |
        OPERATOR_NS=${DEPLOY_NHC_NAMESPACE} \
        SNR_STRATEGY=OutOfServiceTaint \
        LABEL_FILTER="!OCP-ONLY" \
        make test-e2e

    - name: Debug on failure
      if: ${{ !success() }}
      run: |
        echo "=== NHC Status ==="
        kubectl get nodehealthchecks -o yaml 2>/dev/null || true
        echo ""
        echo "=== SelfNodeRemediation CRs ==="
        kubectl get selfnoderemediations -A -o yaml 2>/dev/null || true
        echo ""
        echo "=== SelfNodeRemediationTemplates ==="
        kubectl get selfnoderemediationtemplates -A -o yaml 2>/dev/null || true
        echo ""
        echo "=== Node Status ==="
        kubectl get nodes -o wide 2>/dev/null || true
        echo ""
        echo "=== NHC Events ==="
        kubectl get events -A --sort-by=.lastTimestamp --field-selector reason!=Pulling,reason!=Pulled 2>/dev/null | grep -iE 'healthcheck|remediat|disabled|enabled|template|unhealthy' || echo "No NHC-related events"
        echo ""
        make dev-ci-debug
